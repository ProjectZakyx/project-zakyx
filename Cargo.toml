[workspace]
members = [
    "projekt-ora"
]
resolver = "2"

[workspace.dependencies]
windows = { version = "0.61.1", features = ["Win32", "Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
webview2-com = "0.37.0"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyboard-types = "0.7"
web-sys = "0.3"
url = "2.5"
windows-core = "0.61.2"

