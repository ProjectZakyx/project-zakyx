[package]
name = "projekt-ora"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
tokio = { version = "1.0", features = ["full"] }
windows = { version = "0.61.1", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_EventLog",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Etw",
] }
webview2-com = "0.37.0"

[[bin]]
name = "projekt-ora"
path = "src/main.rs"

[lib]
name = "projekt_ora"
path = "src/lib.rs"

[dev-dependencies]
tokio-test = "0.4"
