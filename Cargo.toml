[package]
name = "ora-browser"
version = "1.0.0"
edition = "2021"
authors = ["Ora Browser Team"]
description = "A modern, cross-platform web browser built with Rust and Tauri"
homepage = "https://github.com/user/ora-browser"
repository = "https://github.com/user/ora-browser"
license = "MIT"
keywords = ["browser", "tauri", "rust", "cross-platform", "web"]
categories = ["web-programming", "gui"]

# 🎯 TAURI v2 KONFIGURATION
[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# 🚀 TAURI CORE v2 (KOMPATIBEL MIT CLI v2.5.0)
tauri = { version = "2.0", features = [ "protocol-asset", "config-json5", "config-toml"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-http = "2.0"

# 📊 SERIALISIERUNG & DATA
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# 🔧 ERROR HANDLING
thiserror = "1.0"
anyhow = "1.0.98"

# 🔄 ASYNC TRAITS
async-trait = "0.1"

# 📝 STRUCTURED LOGGING
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 🪟 WINDOWS APIS (für Windows-spezifische Features)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging", 
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse"
] }

# ⚡ ASYNC RUNTIME
tokio = { version = "1.42", features = ["full"] }

# 🌍 HTTP & NETWORKING
reqwest = { version = "0.12", features = ["json", "stream", "brotli", "rustls-tls", "gzip", "deflate", "http2", "charset"], default-features = false }
url = "2.4"
warp = "0.3"
urlencoding = "2.1"

# 🎲 UTILITIES
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10"
rand = "0.8"

# 🗄️ STORAGE
dirs = "5.0"

# 📝 CONFIGURATION
toml = "0.8"

# 🧪 COMPRESSION (für Smart-Proxy)
flate2 = "1.1.2"
brotli = "8.0.1"

# 🏗️ FEATURE FLAGS
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 🎯 TAURI APP CONFIGURATION
[[bin]]
name = "ora-browser"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
