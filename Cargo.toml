[package]
name = "ora-browser"
version = "1.0.0"
edition = "2021"
authors = ["Ora Browser Team"]
description = "A modern, cross-platform web browser built with Rust and Tauri"
homepage = "https://github.com/user/ora-browser"
repository = "https://github.com/user/ora-browser"
license = "MIT"
keywords = ["browser", "tauri", "rust", "cross-platform", "web"]
categories = ["web-programming", "gui"]

# 🎯 TAURI v2 KONFIGURATION
[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# 🚀 TAURI CORE v2 (KOMPATIBEL MIT CLI v2.5.0)
tauri = { version = "2.0", features = ["config-json5", "config-toml"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-http = "2.0"

# 📊 SERIALISIERUNG & DATA
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# 🔧 ERROR HANDLING
thiserror = "1.0"
anyhow = "1.0.98"

# 🪟 WINDOWS APIS (Legacy Module Support)
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging", 
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse"
] }

# ⚡ ASYNC RUNTIME
tokio = { version = "1.45.1", features = ["full"] }

# 🌍 HTTP & NETWORKING
reqwest = { version = "0.11", features = ["json", "stream", "brotli"] }

# 🛡️ SICHERHEIT
ring = "0.17"
base64 = "0.22"

# 🎲 UTILITIES
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10"

# 📊 LOGS
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 🗄️ STORAGE
dirs = "5.0"

# 🧪 TESTING UTILITIES
once_cell = "1.19"
env_logger = "0.10"

# 🏗️ FEATURE FLAGS
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 🎯 TAURI APP CONFIGURATION
[[bin]]
name = "ora-browser"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
