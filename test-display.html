<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Display Test - Ora Browser</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        .test-container {
            border: 2px solid #00ff00;
            padding: 20px;
            margin: 20px 0;
            background: #333;
        }
        #webview-container {
            border: 3px solid red;
            width: 100%;
            height: 400px;
            background: white;
            color: black;
            padding: 10px;
            box-sizing: border-box;
            overflow: auto;
        }
        .button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .button:hover {
            background: #005a99;
        }
    </style>
</head>
<body>
    <h1>🔧 Ora Browser Display Test</h1>
    
    <div class="test-container">
        <h2>Test Buttons</h2>
        <button class="button" onclick="testSimpleHTML()">Test Simple HTML</button>
        <button class="button" onclick="testGoogleProxy()">Test Google via Proxy</button>
        <button class="button" onclick="testDirectGoogle()">Test Direct Google</button>
        <button class="button" onclick="clearContainer()">Clear Container</button>
    </div>
    
    <div class="test-container">
        <h2>webview-container (Target für Content)</h2>
        <div id="webview-container">
            <h3>🎯 Dies ist der webview-container</h3>
            <p>Hier sollte der geladene Content erscheinen...</p>
            <p>Container ID: <strong>webview-container</strong></p>
            <p>Container sichtbar: <strong>JA</strong></p>
        </div>
    </div>
    
    <div class="test-container">
        <h2>Debug Info</h2>
        <div id="debug-info">
            <p>Warten auf Tests...</p>
        </div>
    </div>

    <script>
        function log(message) {
            console.log(message);
            const debugInfo = document.getElementById('debug-info');
            debugInfo.innerHTML += '<p>' + message + '</p>';
        }

        function testSimpleHTML() {
            log('🔧 Testing simple HTML injection...');
            const container = document.getElementById('webview-container');
            const testHTML = `
                <div style="background: lightblue; padding: 20px; border-radius: 10px;">
                    <h2>✅ Simple HTML Test Successful!</h2>
                    <p>Timestamp: ${new Date().toLocaleString()}</p>
                    <p>Container ID: ${container.id}</p>
                    <p>Container dimensions: ${container.offsetWidth}x${container.offsetHeight}</p>
                </div>
            `;
            container.innerHTML = testHTML;
            log('✅ Simple HTML injected successfully');
        }

        async function testGoogleProxy() {
            log('🔧 Testing Google via Proxy...');
            const container = document.getElementById('webview-container');
            
            try {
                const proxyUrl = 'http://localhost:3030/proxy?url=' + encodeURIComponent('https://google.de');
                log('🌐 Fetching: ' + proxyUrl);
                
                const response = await fetch(proxyUrl);
                log('📡 Response status: ' + response.status + ' ' + response.statusText);
                
                if (response.ok) {
                    const content = await response.text();
                    log('📄 Content received: ' + content.length + ' bytes');
                    log('📄 Content preview: ' + content.substring(0, 100) + '...');
                    
                    // Prüfe ob es HTML ist
                    const isHTML = content.includes('<html') || content.includes('<!DOCTYPE');
                    log('🔍 Is HTML: ' + isHTML);
                    
                    if (isHTML) {
                        container.innerHTML = content;
                        log('✅ Google content injected via proxy');
                    } else {
                        container.innerHTML = '<pre style="white-space: pre-wrap;">' + content.replace(/</g, '&lt;') + '</pre>';
                        log('⚠️ Non-HTML content displayed as text');
                    }
                } else {
                    log('❌ Proxy request failed: ' + response.status);
                    container.innerHTML = '<p style="color: red;">❌ Proxy request failed: ' + response.status + '</p>';
                }
            } catch (error) {
                log('❌ Error: ' + error.message);
                container.innerHTML = '<p style="color: red;">❌ Error: ' + error.message + '</p>';
            }
        }

        async function testDirectGoogle() {
            log('🔧 Testing direct Google (will likely fail due to CORS)...');
            const container = document.getElementById('webview-container');
            
            try {
                const response = await fetch('https://google.de');
                const content = await response.text();
                container.innerHTML = content;
                log('✅ Direct Google loaded (unexpected!)');
            } catch (error) {
                log('❌ Direct Google failed (expected): ' + error.message);
                container.innerHTML = '<p style="color: orange;">❌ Direct Google failed (expected due to CORS): ' + error.message + '</p>';
            }
        }

        function clearContainer() {
            log('🧹 Clearing container...');
            const container = document.getElementById('webview-container');
            container.innerHTML = '<p>🧹 Container cleared</p>';
            log('✅ Container cleared');
        }

        // Initial info
        window.addEventListener('load', () => {
            log('🚀 Test page loaded');
            log('📄 Container found: ' + (document.getElementById('webview-container') ? 'YES' : 'NO'));
        });
    </script>
</body>
</html>
